<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar/Plan base -->
  <rect x="20" y="15" width="60" height="70" fill="none" stroke="#2E2A3B" stroke-width="2.5" rx="4"/>
  
  <!-- Calendar header -->
  <line x1="20" y1="30" x2="80" y2="30" stroke="#2E2A3B" stroke-width="2"/>
  
  <!-- Calendar holes -->
  <circle cx="35" cy="22.5" r="2" fill="none" stroke="#2E2A3B" stroke-width="1.5"/>
  <circle cx="65" cy="22.5" r="2" fill="none" stroke="#2E2A3B" stroke-width="1.5"/>
  
  <!-- Timeline bars -->
  <rect x="30" y="40" width="25" height="4" fill="#2E2A3B" rx="2"/>
  <rect x="30" y="50" width="35" height="4" fill="#2E2A3B" rx="2"/>
  <rect x="30" y="60" width="20" height="4" fill="#2E2A3B" rx="2"/>
  <rect x="30" y="70" width="40" height="4" fill="#2E2A3B" rx="2"/>
  
  <!-- Checkmarks -->
  <polyline points="62,42 65,45 70,40" fill="none" stroke="#2E2A3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="57,62 60,65 65,60" fill="none" stroke="#2E2A3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>